<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const params = new URLSearchParams(location.search);
const url = params.get('url');
const view = params.get('view') || 'front';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x28304a);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(1, 2, 3); scene.add(key);

const gltf = await new GLTFLoader().loadAsync(url);
if (params.get('normals') === '1') {
  const nm = new THREE.MeshNormalMaterial();
  gltf.scene.traverse(o => { if (o.isMesh) o.material = nm; });
}
scene.add(gltf.scene);
const box = new THREE.Box3().setFromObject(gltf.scene);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 10000);
const d = size.length();
if (view === 'front') cam.position.set(center.x, center.y, box.max.z + d * 0.9);
else if (view === 'side') cam.position.set(box.max.x + d * 0.9, center.y, center.z);
else if (view === 'face') cam.position.set(center.x, box.max.y - size.y * 0.22, box.max.z + d * 0.35);
else cam.position.set(center.x + d * 0.5, center.y + d * 0.3, box.max.z + d * 0.7);
cam.lookAt(center);
if (params.get('skel') === '1') scene.add(new THREE.SkeletonHelper(gltf.scene));
renderer.render(scene, cam);
window.__READY__ = true;
</script>
</body>
</html>
